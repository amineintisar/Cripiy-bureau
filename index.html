<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Overtime Horror P2P UltraStable</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; background: #07070a; font-family: 'Segoe UI', Arial, sans-serif; color: #eee; overflow: hidden; }
        
        #menu, #lobby, #game-container, #game-over { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; position: absolute; top:0; left:0; }
        #lobby, #game-container, #game-over { display: none; }
        #game-container { background: #050508; }
        #game-over { background: rgba(0,0,0,0.95); z-index: 100; color: #ff3333; text-align: center; }

        .panel { background: rgba(20, 20, 30, 0.9); border: 1px solid #333344; border-radius: 16px; padding: 30px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        h1 { font-size: 28px; letter-spacing: 2px; color: #ff3b3b; margin-bottom: 10px; text-shadow: 0 0 10px rgba(255,59,59,0.2); }
        p.desc { font-size: 13px; color: #8a8a9a; margin-bottom: 20px; line-height: 1.4; }
        
        .btn { background: #ff3b3b; color: #fff; border: none; padding: 15px 24px; margin: 8px 0; font-size: 15px; font-weight: bold; cursor: pointer; border-radius: 8px; width: 100%; transition: all 0.2s; box-shadow: 0 4px 12px rgba(255,59,59,0.2); }
        .btn-sec { background: #222230; border: 1px solid #444455; box-shadow: none; }
        .btn:disabled { background: #333 !important; color: #777; cursor: not-allowed; box-shadow: none; }
        .btn:active:not(:disabled) { transform: scale(0.98); opacity: 0.9; }
        input { width: 100%; padding: 14px; font-size: 18px; text-align: center; margin: 10px 0; background: #13131c; color: #fff; border: 1px solid #333344; border-radius: 8px; font-family: monospace; letter-spacing: 2px; text-transform: uppercase; }

        /* HUD */
        #hud { position: absolute; top: 0; left: 0; width: 100%; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; padding: 12px; font-size: 11px; font-weight: bold; z-index: 10; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); pointer-events: none;}
        .hud-item { display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.08); margin: 2px; }
        .bar-container { width: 60px; background: #222; height: 8px; border-radius: 4px; overflow: hidden; display: inline-block; }
        .bar { height: 100%; width: 100%; transition: width 0.1s linear; }
        #energy-bar { background: #00ffcc; box-shadow: 0 0 6px #00ffcc; }
        #hunger-bar { background: #ff9900; box-shadow: 0 0 6px #ff9900; }
        #oxygen-bar { background: #3399ff; box-shadow: 0 0 6px #3399ff; }
        #clock { color: #ffcc00; font-size: 14px; font-family: monospace; }

        /* Fenêtre de jeu */
        #view { width: 100%; flex: 1; position: relative; background: #101014; overflow: hidden; }
        #flashlight-overlay { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events: none; z-index: 5; background: radial-gradient(circle 110px at var(--px, 50%) var(--py, 50%), transparent 100%, rgba(3,3,5,0.95) 100%); transition: background 0.1s ease; }
        #suffocate-overlay { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events: none; z-index: 6; background: rgba(255,0,0,0); transition: background 0.3s ease; }

        /* Entités (Ajout Joueurs 3 et 4) */
        .player { width: 20px; height: 20px; background: #3388ff; border: 2px solid #fff; border-radius: 50%; position: absolute; z-index: 3; box-shadow: 0 0 10px #3388ff; }
        .player.peer2 { background: #a833ff; box-shadow: 0 0 10px #a833ff; }
        .player.peer3 { background: #22ff22; box-shadow: 0 0 10px #22ff22; }
        .player.peer4 { background: #ffaa00; box-shadow: 0 0 10px #ffaa00; }
        .monster { width: 26px; height: 26px; background: #ff1133; border: 2px solid #ff9999; border-radius: 50%; position: absolute; display: none; box-shadow: 0 0 25px #ff1133; z-index: 3;}
        
        /* Décors */
        .object { position: absolute; display: flex; justify-content: center; align-items: center; font-size: 9px; font-weight: bold; border-radius: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.4); }
        .desk { background: #3d2516; border: 2px solid #23150d; width: 45px; height: 30px; color: #855b3e; }
        .closet { background: #262b30; border: 2px solid #15181b; width: 38px; height: 38px; color: #52ff52; border-top: 3px solid #363d44; }
        .door { background: #541616; border: 2px solid #300d0d; width: 40px; height: 12px; color: #ff9999; font-size: 8px; }
        .coffee-machine { background: #1a1a1a; border: 2px solid #00ffcc; width: 30px; height: 30px; color: #00ffcc; }
        .food { background: #18330c; border: 1px solid #55ff55; width: 16px; height: 16px; border-radius: 50%; color: #fff; font-size: 10px; box-shadow: 0 0 5px rgba(85,255,85,0.3); }

        /* Contrôles */
        #controls { height: 170px; width: 100%; background: #050507; border-top: 1px solid #16161f; display: flex; justify-content: space-around; align-items: center; padding: 10px; position: relative; z-index: 20; }
        .joystick-container { width: 110px; height: 110px; background: rgba(255,255,255,0.02); border: 2px solid rgba(255,255,255,0.08); border-radius: 50%; display: flex; justify-content: center; align-items: center; position: relative; touch-action: none; }
        .joystick-handle { width: 45px; height: 45px; background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; position: absolute; pointer-events: none; }
        #action-btn { width: 85px; height: 85px; background: linear-gradient(135deg, #cc1111, #880000); border: 2px solid #ff4444; border-radius: 50%; color: white; font-weight: bold; font-size: 13px; letter-spacing: 1px; box-shadow: 0 5px 12px rgba(204,17,17,0.3); }
        
        #subtitle { position: absolute; bottom: 185px; width: 90%; left: 5%; text-align: center; background: rgba(5,5,10,0.85); border: 1px solid #222233; border-radius: 6px; padding: 6px; font-size: 12px; color: #ffcc00; z-index: 10;}
    </style>
</head>
<body>

    <!-- MENU PRINCIPAL -->
    <div id="menu">
        <div class="panel">
            <h1>OVERTIME</h1>
            <p class="desc">Restez éveillé, trouvez à manger et survivez jusqu'à 06:00 (Jusqu'à 4 Joueurs).</p>
            <button class="btn" onclick="startSolo()">Jouer Solo</button>
            <div style="margin: 12px 0; color: #444455; font-size: 11px;">— MULTIJOUEUR (MAX 4) —</div>
            <button class="btn btn-sec" onclick="initMultiplayer(true)">Créer un salon</button>
            <input type="text" id="join-code" placeholder="Code secret à 5 lettres" maxlength="5">
            <button class="btn btn-sec" style="margin-top:0;" onclick="initMultiplayer(false)">Rejoindre</button>
        </div>
    </div>

    <!-- SALLE D'ATTENTE (LOBBY) -->
    <div id="lobby">
        <div class="panel">
            <h2>SALON D'ATTENTE</h2>
            <div style="margin: 15px 0; font-size: 18px; color: #00ffcc; font-weight: bold;">
                CODE : <span id="lobby-code-display">CONNEXION...</span>
            </div>
            <p style="font-size: 13px; color: #aaa; margin-bottom: 10px;">Joueurs connectés :</p>
            <div id="player-list" style="background:#13131c; padding: 10px; border-radius:8px; font-size:14px; text-align:left; margin-bottom:20px;">
                • Toi (Hôte)
            </div>
            <button id="start-match-btn" class="btn" disabled onclick="hostLaunchGame()">LANCER LA PARTIE</button>
        </div>
    </div>

    <!-- ZONE DE JEU -->
    <div id="game-container">
        <div id="hud">
            <div class="hud-item">🕒 <span id="clock">22:00</span></div>
            <div class="hud-item">⚡ <div class="bar-container"><div id="energy-bar" class="bar"></div></div></div>
            <div class="hud-item">🍔 <div class="bar-container"><div id="hunger-bar" class="bar"></div></div></div>
            <div class="hud-item">🫁 <div class="bar-container"><div id="oxygen-bar" class="bar"></div></div></div>
        </div>
        <div id="subtitle">Heures sup'... restons groupés pour survivre.</div>
        
        <div id="view">
            <div id="flashlight-overlay"></div>
            <div id="suffocate-overlay"></div>
            <div id="player1" class="player"></div>
            <div id="player2" class="player peer2" style="display:none;"></div>
            <div id="player3" class="player peer3" style="display:none;"></div>
            <div id="player4" class="player peer4" style="display:none;"></div>
            <div id="the-monster" class="monster"></div>
        </div>

        <div id="controls">
            <div class="joystick-container" id="joy-container">
                <div class="joystick-handle" id="joy-handle"></div>
            </div>
            <button id="action-btn" onclick="triggerAction()">INTERAGIR</button>
        </div>
    </div>

    <!-- GAME OVER -->
    <div id="game-over">
        <div class="panel" style="border-color: #551111;">
            <h1 id="game-over-title">GAME OVER</h1>
            <p id="game-over-reason" style="margin: 15px 0; font-size: 13px; color: #bbb;"></p>
            <button class="btn" onclick="location.reload()">Retour Menu</button>
        </div>
    </div>

    <script>
        const view = document.getElementById('view');
        const overlay = document.getElementById('flashlight-overlay');
        const suffocateOverlay = document.getElementById('suffocate-overlay');
        const p1 = document.getElementById('player1');
        
        // Dictionnaire pour gérer dynamiquement les visuels des autres joueurs
        const remotePlayersElements = {
            2: document.getElementById('player2'),
            3: document.getElementById('player3'),
            4: document.getElementById('player4')
        };
        
        const monsterElem = document.getElementById('the-monster');
        const subtitle = document.getElementById('subtitle');
        
        let gameState = {
            id: null, // Sera défini lors de l'attribution des places (1 à 4)
            x: 40, y: 120,
            energy: 100, hunger: 100, oxygen: 100,
            hour: 22, minutes: 0,
            hidden: false,
            monsterActive: false,
            monsterX: 420, monsterY: 120,
            monsterState: 'chase',
            monsterLostTimer: 0,
            gameOver: false
        };

        // État local de la position de TOUS les joueurs connectés
        let playersWorldState = {};

        const objects = [
            { type: 'desk', x: 30, y: 40, label: 'Bureau' },
            { type: 'desk', x: 130, y: 40, label: 'Bureau' },
            { type: 'desk', x: 30, y: 220, label: 'Bureau' },
            { type: 'desk', x: 130, y: 220, label: 'Bureau' },
            { type: 'coffee-machine', x: 15, y: 130, label: '☕' },
            { type: 'closet', x: 220, y: 35, label: 'Armoire' },
            { type: 'closet', x: 220, y: 215, label: 'Armoire' },
            { type: 'door', x: 300, y: 120, label: 'PORTE' }, 
            { type: 'food', x: 380, y: 50, label: '🍩', active: true },
            { type: 'food', x: 420, y: 200, label: '🍏', active: true },
            { type: 'food', x: 90, y: 50, label: '🍫', active: true },
            { type: 'food', x: 140, y: 230, label: '🍪', active: true },
            { type: 'food', x: 360, y: 230, label: '🥪', active: true }
        ];

        let peer; 
        let connections = []; // Tableau de toutes les connexions actives (Hôte <-> Clients)
        let isHost = false; 
        let isMultiplayer = false;
        const ROOM_PREFIX = "othr4p-";

        const peerConfig = {
            host: '0.peerjs.com',
            port: 443,
            path: '/',
            secure: true,
            debug: 1
        };

        function createMap() {
            objects.forEach((obj, index) => {
                let div = document.createElement('div');
                div.className = `object ${obj.type}`;
                div.style.left = obj.x + 'px';
                div.style.top = obj.y + 'px';
                div.innerText = obj.label;
                div.id = `obj-${index}`;
                view.appendChild(div);
            });
        }

        function checkFoodRespawn() {
            objects.forEach((obj, idx) => {
                if (obj.type === 'food' && !obj.active) {
                    if (Math.random() < 0.20) {
                        obj.active = true;
                        let el = document.getElementById(`obj-${idx}`);
                        if(el) el.style.display = 'flex';
                    }
                }
            });
        }

        // --- JOYSTICK ---
        const joyContainer = document.getElementById('joy-container');
        const joyHandle = document.getElementById('joy-handle');
        let moveX = 0, moveY = 0;
        let isDragging = false;

        function handleJoystick(clientX, clientY) {
            const rect = joyContainer.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            let deltaX = clientX - centerX;
            let deltaY = clientY - centerY;
            let distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            const maxRadius = rect.width / 2 - 5;

            if (distance > maxRadius) {
                deltaX = (deltaX / distance) * maxRadius;
                deltaY = (deltaY / distance) * maxRadius;
            }
            joyHandle.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
            moveX = deltaX / maxRadius;
            moveY = deltaY / maxRadius;
        }

        joyContainer.addEventListener('touchstart', (e) => {
            isDragging = true;
            handleJoystick(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            handleJoystick(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        window.addEventListener('touchend', () => {
            isDragging = false;
            joyHandle.style.transform = 'translate(0px, 0px)';
            moveX = 0; moveY = 0;
        });

        function triggerAction() {
            objects.forEach((obj, idx) => {
                if (obj.type === 'food' && !obj.active) return;
                
                let dx = Math.abs((gameState.x + 10) - (obj.x + 15));
                let dy = Math.abs((gameState.y + 10) - (obj.y + 15));
                
                if(dx < 35 && dy < 35) {
                    if(obj.type === 'coffee-machine') {
                        gameState.energy = Math.min(100, gameState.energy + 40);
                        subtitle.innerText = "Le café me redonne des forces !";
                    }
                    else if(obj.type === 'door' && !gameState.monsterActive) {
                        gameState.monsterActive = true;
                        monsterElem.style.display = 'block';
                        subtitle.innerText = "OH NON ! COURS, CACHE-TOI !";
                        broadcast({type: 'MONSTER_TRIGGER'});
                    }
                    else if(obj.type === 'closet') {
                        if (gameState.oxygen < 30 && !gameState.hidden) return;
                        gameState.hidden = !gameState.hidden;
                        p1.style.filter = gameState.hidden ? "brightness(0.2)" : "none";
                    }
                    else if(obj.type === 'food' && obj.active) {
                        gameState.hunger = Math.min(100, gameState.hunger + 35);
                        obj.active = false;
                        document.getElementById(`obj-${idx}`).style.display = 'none';
                        broadcast({type: 'FOOD_EATEN', index: idx});
                    }
                }
            });
        }

        function startGameLoop() {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('menu').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            createMap();
            setInterval(updateClock, 2500); 
            setInterval(checkFoodRespawn, 4000); 
            gameLoop();
        }

        function updateClock() {
            if(gameState.gameOver) return;
            gameState.minutes += 10;
            if(gameState.minutes >= 60) { gameState.minutes = 0; gameState.hour++; }
            if(gameState.hour === 24) gameState.hour = 0;
            document.getElementById('clock').innerText = `${gameState.hour.toString().padStart(2,'0')}:${gameState.minutes.toString().padStart(2,'0')}`;
            if(gameState.hour === 6) endGame(true, "06:00. Victoire collective !");
        }

        function gameLoop() {
            if(gameState.gameOver) return;

            if(!gameState.hidden) {
                gameState.x += moveX * 3.2;
                gameState.y += moveY * 3.2;
                gameState.x = Math.max(5, Math.min(view.clientWidth - 25, gameState.x));
                gameState.y = Math.max(5, Math.min(view.clientHeight - 25, gameState.y));
                p1.style.left = gameState.x + 'px';
                p1.style.top = gameState.y + 'px';
                gameState.oxygen = Math.min(100, gameState.oxygen + 1.2);
                suffocateOverlay.style.background = "rgba(255,0,0,0)";
            } else {
                gameState.oxygen = Math.max(0, gameState.oxygen - 0.45);
                if(gameState.oxygen < 35) {
                    suffocateOverlay.style.background = `rgba(255,0,0,${(35 - gameState.oxygen)/35 * 0.5})`;
                }
                if(gameState.oxygen <= 0) {
                    gameState.hidden = false;
                    p1.style.filter = "none";
                }
            }

            let percentX = ((gameState.x + 10) / view.clientWidth) * 100;
            let percentY = ((gameState.y + 10) / view.clientHeight) * 100;
            overlay.style.setProperty('--px', `${percentX}%`);
            overlay.style.setProperty('--py', `${percentY}%`);

            // AJUSTEMENT : Vitesse de descente divisée par 2 pour la faim et l'énergie
            gameState.energy = Math.max(0, gameState.energy - 0.02);
            gameState.hunger = Math.max(0, gameState.hunger - 0.025);
            document.getElementById('energy-bar').style.width = gameState.energy + '%';
            document.getElementById('hunger-bar').style.width = gameState.hunger + '%';
            document.getElementById('oxygen-bar').style.width = gameState.oxygen + '%';

            if(gameState.energy <= 0 || gameState.hunger <= 0) endGame(false, "Mort d'épuisement...");

            // IA ET DÉPLACEMENTS DU MONSTRE
            if(gameState.monsterActive) {
                let targetX = gameState.x; 
                let targetY = gameState.y;
                
                // En multijoueur, le monstre cherche et cible le joueur non caché le plus proche
                if(isMultiplayer) {
                    let closestDist = Math.sqrt(Math.pow(gameState.x - gameState.monsterX, 2) + Math.pow(gameState.y - gameState.monsterY, 2));
                    if(gameState.hidden) closestDist = 99999;
                    
                    Object.keys(playersWorldState).forEach(pId => {
                        let p = playersWorldState[pId];
                        if(!p.hidden) {
                            let d = Math.sqrt(Math.pow(p.x - gameState.monsterX, 2) + Math.pow(p.y - gameState.monsterY, 2));
                            if(d < closestDist) {
                                closestDist = d;
                                targetX = p.x;
                                targetY = p.y;
                            }
                        }
                    });
                }

                let distToTarget = Math.sqrt(Math.pow(targetX - gameState.monsterX, 2) + Math.pow(targetY - gameState.monsterY, 2));

                if (gameState.hidden || distToTarget > 180) {
                    if (gameState.monsterState === 'chase') {
                        gameState.monsterState = 'lost';
                        gameState.monsterLostTimer = Date.now();
                    }
                } else if (!gameState.hidden && distToTarget < 140) {
                    gameState.monsterState = 'chase';
                }

                if (gameState.monsterState === 'lost') {
                    if (Date.now() - gameState.monsterLostTimer > 3500) { targetX = 420; targetY = 120; }
                    else { targetX = gameState.monsterX + Math.sin(Date.now() / 150) * 35; targetY = gameState.monsterY + Math.cos(Date.now() / 150) * 35; }
                }

                let mdx = targetX - gameState.monsterX; let mdy = targetY - gameState.monsterY;
                let mDist = Math.sqrt(mdx*mdx + mdy*mdy);
                if(mDist > 2) {
                    // AJUSTEMENT : Vitesses du monstre ralenties pour le rendre gérable
                    let speed = (gameState.monsterState === 'chase') ? 1.5 : 0.8;
                    gameState.monsterX += (mdx / mDist) * speed; gameState.monsterY += (mdy / mDist) * speed;
                }
                monsterElem.style.left = gameState.monsterX + 'px'; monsterElem.style.top = gameState.monsterY + 'px';

                if(distToTarget < 20 && !gameState.hidden) endGame(false, "Le monstre vous a dévoré !");
            }

            // Envoi des paquets réseaux de synchronisation
            if(isMultiplayer) {
                broadcast({
                    type: 'SYNC', 
                    pId: gameState.id,
                    x: gameState.x, 
                    y: gameState.y, 
                    hidden: gameState.hidden,
                    monsterX: gameState.monsterX, 
                    monsterY: gameState.monsterY, 
                    monsterActive: gameState.monsterActive
                });
            }
            requestAnimationFrame(gameLoop);
        }

        function updateLobbyUI() {
            let html = `• Toi (Joueur ${gameState.id})<br>`;
            connections.forEach((c, idx) => {
                html += `• Allié Connecté (Joueur ${c.assignedId})<br>`;
            });
            document.getElementById('player-list').innerHTML = html;
            
            if(isHost) {
                document.getElementById('start-match-btn').disabled = (connections.length === 0);
            }
        }

        function broadcast(data) {
            connections.forEach(c => {
                if(c.open) c.send(data);
            });
        }

        function endGame(victory, reason) {
            gameState.gameOver = true;
            document.getElementById('game-over').style.display = 'flex';
            document.getElementById('game-over-title').innerText = victory ? "VICTOIRE !" : "GAME OVER";
            document.getElementById('game-over-title').style.color = victory ? "#00ffcc" : "#ff3b3b";
            document.getElementById('game-over-reason').innerText = reason;
        }

        function generateRandomCode() {
            const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
            let code = "";
            for(let i=0; i<5; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
            return code;
        }

        // --- GESTION RESEAU JUSQU'À 4 JOUEURS ---
        function initMultiplayer(host) {
            isHost = host;
            isMultiplayer = true;
            document.getElementById('menu').style.display = 'none';
            document.getElementById('lobby').style.display = 'flex';

            if(isHost) {
                gameState.id = 1; // L'hôte est toujours joueur 1
                let secretCode = generateRandomCode();
                document.getElementById('lobby-code-display').innerText = secretCode.toUpperCase();
                updateLobbyUI();

                peer = new Peer(ROOM_PREFIX + secretCode, peerConfig); 

                peer.on('open', () => {
                    peer.on('connection', (connection) => {
                        if(connections.length >= 3) { // Max 4 joueurs (Hôte + 3 clients)
                            connection.on('open', () => {
                                connection.send({type: 'FULL'});
                                setTimeout(() => connection.close(), 500);
                            });
                            return;
                        }
                        
                        // Attribue un ID libre au nouveau joueur rejoignant
                        let nextId = connections.length + 2; 
                        connection.assignedId = nextId;
                        
                        connections.push(connection);
                        setupMultiplayerEvents(connection);
                    });
                });
            } else {
                let inputCode = document.getElementById('join-code').value.trim().toLowerCase();
                if(!inputCode || inputCode.length !== 5) {
                    alert("Rentre un code valide à 5 lettres !");
                    location.reload();
                    return;
                }

                document.getElementById('lobby-code-display').innerText = inputCode.toUpperCase();
                document.getElementById('player-list').innerHTML = "Connexion sécurisée au groupe en cours...";

                peer = new Peer(peerConfig);
                
                peer.on('open', () => {
                    let connection = peer.connect(ROOM_PREFIX + inputCode);
                    setupMultiplayerEvents(connection);
                    
                    setTimeout(() => {
                        if(!connection.open) {
                            alert("Impossible de joindre le groupe. Salon plein ou code inexistant.");
                            location.reload();
                        }
                    }, 6000);
                });
            }

            peer.on('error', (err) => {
                alert("Erreur réseau. Relancez la room.");
                location.reload();
            });
        }

        function setupMultiplayerEvents(c) {
            c.on('open', () => {
                if(isHost) {
                    // L'hôte valide la connexion et donne son ID au client
                    c.send({type: 'ASSIGN_ID', id: c.assignedId});
                    updateLobbyUI();
                } else {
                    connections.push(c); // Le client stocke son unique canal vers l'hôte
                }
            });

            c.on('data', (data) => {
                if(data.type === 'ASSIGN_ID') {
                    gameState.id = data.id;
                    updateLobbyUI();
                    document.getElementById('lobby-code-display').innerText = "ATTENTE DU LANCEMENT HÔTE...";
                }
                else if(data.type === 'FULL') {
                    alert("Ce salon contient déjà 4 joueurs !");
                    location.reload();
                }
                else if(data.type === 'LAUNCH') {
                    startGameLoop();
                }
                else if(data.type === 'SYNC') {
                    // Sauvegarde la position reçue du joueur distant
                    if(data.pId !== gameState.id) {
                        playersWorldState[data.pId] = { x: data.x, y: data.y, hidden: data.hidden };
                        
                        // Met à jour l'élément HTML correspondant sur l'écran
                        let el = remotePlayersElements[data.pId];
                        if(el) {
                            el.style.display = 'block';
                            el.style.left = data.x + 'px';
                            el.style.top = data.y + 'px';
                            el.style.filter = data.hidden ? "brightness(0.1)" : "none";
                        }
                    }

                    // Synchronisation du monstre calculé par l'Hôte vers les clients
                    if(!isHost && data.monsterActive) {
                        gameState.monsterActive = true; 
                        monsterElem.style.display = 'block';
                        gameState.monsterX = data.monsterX; 
                        gameState.monsterY = data.monsterY;
                    }

                    // L'hôte sert de relais : il renvoie les positions reçues aux autres clients connectés
                    if(isHost) {
                        connections.forEach(conn => {
                            if(conn !== c && conn.open) conn.send(data);
                        });
                    }
                }
                else if(data.type === 'MONSTER_TRIGGER') { 
                    gameState.monsterActive = true; 
                    monsterElem.style.display = 'block';
                    if(isHost) broadcast(data);
                }
                else if(data.type === 'FOOD_EATEN') {
                    objects[data.index].active = false;
                    let el = document.getElementById(`obj-${data.index}`); 
                    if(el) el.style.display = 'none';
                    if(isHost) broadcast(data);
                }
            });

            c.on('close', () => { 
                alert("Un membre de l'équipe s'est déconnecté."); 
                location.reload(); 
            });
        }

        function hostLaunchGame() {
            if(isHost) {
                broadcast({type: 'LAUNCH'});
                startGameLoop();
            }
        }
        function startSolo() { gameState.id = 1; startGameLoop(); }
    </script>
</body>
</html>
